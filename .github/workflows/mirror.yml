name: Mirror Repository

on:
  workflow_call:
    secrets:
      MIRROR_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  mirror:
    if: github.repository == 'b45ti3n/NexPlay'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.deleted && format('refs/heads/{0}', github.event.repository.default_branch) || github.ref }}

      - name: Configure SSH
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to organization repository
        run: |
          git remote add mirror git@github.com:EpitechPGE3-2026/G-PRO-500-PAR-5-1-professionalwork-48

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          git push --force --prune mirror \
            '+refs/remotes/origin/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
