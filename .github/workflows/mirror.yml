name: Mirror Sync

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

concurrency:
  group: mirror-sync-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-to-mirror:
    name: Sync ${{ github.event.workflow_run.head_branch }} to Mirror
    if: ${{ github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'b45ti3n/NexPlay' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Load SSH key for mirror
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_KEY }}

      - name: Push branch to mirror repository
        env:
          MIRROR_URL: ${{ secrets.MIRROR_REPO_URL }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          git remote add mirror "$MIRROR_URL"
          git push mirror "HEAD:refs/heads/${TARGET_BRANCH}"
