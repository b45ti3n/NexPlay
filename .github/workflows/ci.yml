name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    if: github.event.deleted != true && github.repository == 'b45ti3n/NexPlay'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  mirror:
    needs: ci

    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.event.deleted == true || needs.ci.result == 'success')

    uses: ./.github/workflows/mirror.yml

    secrets:
      MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
