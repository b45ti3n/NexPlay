name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1A. Fast Gate: Commitlint (Validates PR Title on Pull Requests)
  commitlint:
    name: Commitlint
    if:
      github.event_name == 'pull_request' &&
      github.repository == 'b45ti3n/NexPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1B. Fast Gate: Code Linter (Runs in parallel with Commitlint)
  linter:
    name: Linter
    if: github.repository == 'b45ti3n/NexPlay'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run Linter
        run: pnpm lint
        run: pnpm typecheck

  # 2. Verification: Test Suite (Gated by Linter & Commitlint)
  test-suite:
    name: Test Suite
    needs: [linter, commitlint]
    if: |
      always() &&
      github.repository == 'b45ti3n/NexPlay' &&
      needs.linter.result == 'success' &&
      (needs.commitlint.result == 'success' || needs.commitlint.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run Tests
        run: pnpm test
